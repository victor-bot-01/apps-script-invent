<!DOCTYPE html>
<html lang="pt-BR">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Contagem de Inventário</title>
<style>
  :root {
    --bg: #eef0f3; --surface: #ffffff; --surface-2: #f3f4f6; --border: #d9dde3;
    --text: #111827; --muted: #6b7280; --accent: #2563eb; --accent-soft: #e6eeff;
    --ok: #15803d; --warn: #b45309; --bad: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --surface: #171a21; --surface-2: #20242d; --border: #2e3440;
      --text: #e6e8ec; --muted: #9aa3b2; --accent: #6b9bff; --accent-soft: #1e2a47;
      --ok: #22a355; --warn: #d97706; --bad: #dc4a4a;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow-x: hidden; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 420px; min-height: 100%;
    background: var(--surface); display: flex; flex-direction: column;
    padding: 14px 18px 18px; gap: 14px; position: relative; overflow: hidden;
  }
  @media (min-width: 480px) {
    body { align-items: flex-start; padding: 24px 0; }
    .app {
      margin: auto 0; min-height: min(820px, calc(100vh - 48px));
      border-radius: 28px; border: 1px solid var(--border); box-shadow: 0 10px 40px rgba(0,0,0,.12);
    }
  }

  /* Cabeçalho: Título + ☰ */
  .topo { display: flex; align-items: flex-start; gap: 10px; }
  .titulo { flex: 1; min-width: 0; }
  .titulo h1 { margin: 0; font-size: 24px; font-weight: 700; line-height: 1.2; overflow-wrap: anywhere; }
  .titulo .sub { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 4px; color: var(--muted); font-size: 13px; }
  .chip-cat {
    background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: 12px;
    padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  }
  .menu-btn {
    width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 22px; cursor: pointer; flex: none; position: relative;
  }
  .menu-btn .ponto { position: absolute; top: 6px; right: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--accent); }

  /* Foto */
  .foto {
    flex: 1 1 auto; min-height: 140px; border-radius: 16px; border: 1px solid var(--border);
    background: var(--surface-2); display: grid; place-items: center; overflow: hidden; position: relative;
  }
  .foto img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .foto .ph { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
  .foto .ph b { font-size: 72px; line-height: 1; }

  /* Contadores */
  .contador { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .passo {
    width: 64px; height: 64px; border-radius: 16px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 34px; font-weight: 600; cursor: pointer;
    display: grid; place-items: center; user-select: none; touch-action: manipulation;
  }
  .passo:active { transform: scale(.94); background: var(--accent-soft); }
  .passo.mais { background: var(--accent); border-color: var(--accent); color: #fff; }
  .numero {
    width: 110px; height: 64px; text-align: center; font-size: 40px; font-weight: 700;
    border: 1px solid transparent; border-radius: 14px; background: transparent; color: var(--text);
    font-variant-numeric: tabular-nums; -moz-appearance: textfield; font-family: inherit;
  }
  .numero:focus { outline: none; border-color: var(--accent); background: var(--accent-soft); }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .rotulo-cont { text-align: center; color: var(--muted); font-size: 12px; margin-top: -8px; }

  /* Validade */
  .validade {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    height: 54px; border-radius: 14px; border: 1.5px solid var(--text); background: var(--surface);
    font-size: 20px; font-weight: 600; cursor: pointer; position: relative; color: var(--text);
  }
  .validade small { font-weight: 500; color: var(--muted); font-size: 14px; }
  .validade input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
  .validade.vencido { border-color: var(--bad); color: var(--bad); }

  /* Navegação */
  .nav { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .seta {
    width: 76px; height: 54px; border-radius: 14px; border: 1px solid var(--border); flex: none;
    background: var(--surface); color: var(--text); font-size: 28px; cursor: pointer; touch-action: manipulation;
  }
  .seta:active { background: var(--accent-soft); }
  .pos { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; text-align: center; min-width: 0; }
  .pos small { display: block; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Sem etiqueta */
  .sem-etiqueta { display: flex; align-items: center; justify-content: center; gap: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
  .sem-etiqueta span { font-size: 14px; color: var(--muted); margin-right: 4px; }
  .sem-etiqueta .passo { width: 42px; height: 42px; font-size: 22px; border-radius: 10px; }
  .sem-etiqueta .passo.mais { background: var(--surface); border-color: var(--border); color: var(--text); }
  .sem-etiqueta .numero { width: 64px; height: 42px; font-size: 22px; border: 1.5px solid var(--text); border-radius: 8px; }

  /* Aviso de salvamento / envio */
  .status {
    position: absolute; top: 16px; left: 50%; transform: translate(-50%, -80px);
    color: #fff; font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 999px;
    transition: transform .2s; pointer-events: none; z-index: 50; white-space: nowrap; max-width: 92%;
    overflow: hidden; text-overflow: ellipsis; background: var(--ok);
  }
  .status.show { transform: translate(-50%, 0); }
  .status.salvando { background: var(--warn); }
  .status.erro {
    background: var(--bad); pointer-events: auto; cursor: pointer;
    white-space: normal; text-align: center; width: max-content; border-radius: 14px;
  }
  .status a { color: #fff; text-decoration: underline; margin-left: 6px; pointer-events: auto; }
  .status.link { pointer-events: auto; }

  /* Menu */
  .veu { position: absolute; inset: 0; background: rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; }
  .veu.aberto { opacity: 1; pointer-events: auto; }
  .gaveta {
    position: absolute; top: 0; right: 0; bottom: 0; width: 86%; max-width: 360px;
    background: var(--surface); transform: translateX(100%); transition: transform .25s; z-index: 21;
    display: flex; flex-direction: column; padding: 18px; gap: 12px; visibility: hidden;
  }
  .gaveta.aberta { transform: translateX(0); visibility: visible; }
  .gaveta h2 { margin: 0; font-size: 18px; display: flex; justify-content: space-between; align-items: center; }
  .gaveta h2 button { border: 0; background: none; font-size: 24px; color: var(--text); cursor: pointer; }
  .secao { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
  .cats { display: flex; flex-direction: column; gap: 6px; max-height: 40vh; overflow: auto; flex: none; }
  .cats button {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 11px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface);
    color: var(--text); font: inherit; font-weight: 600; cursor: pointer; text-align: left;
  }
  .cats button small { color: var(--muted); font-weight: 500; white-space: nowrap; }
  .cats button.ativa { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .cats button.ativa small { color: var(--accent); }
  .rels { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .rels button {
    display: flex; gap: 8px; align-items: flex-start; text-align: left; padding: 10px 11px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text); font: inherit; cursor: pointer;
  }
  .rels button:active { background: var(--accent-soft); }
  .rels .ic { font-size: 18px; line-height: 1.2; }
  .rels b { display: block; font-size: 14px; }
  .rels small { display: block; color: var(--muted); font-size: 11px; line-height: 1.3; margin-top: 2px; }
  .gaveta input[type=search] {
    width: 100%; height: 46px; border-radius: 12px; border: 1px solid var(--border);
    padding: 0 14px; font: inherit; background: var(--surface-2); color: var(--text);
  }
  .dica { color: var(--muted); font-size: 12px; margin-top: -4px; }
  .lista { flex: 1; overflow: auto; margin: 0 -18px; border-top: 1px solid var(--border); min-height: 60px; }
  .lista button {
    display: block; width: 100%; text-align: left; padding: 10px 18px; border: 0; border-bottom: 1px solid var(--border);
    background: none; color: var(--text); font: inherit; cursor: pointer;
  }
  .lista button:hover, .lista button.atual { background: var(--accent-soft); }
  .lista .meta { display: flex; gap: 8px; align-items: center; margin-top: 2px; color: var(--muted); font-size: 12px; }

  /* Confirmação do relatório */
  .folha-veu { position: absolute; inset: 0; background: rgba(0,0,0,.45); z-index: 40; display: none; align-items: flex-end; }
  .folha-veu.aberta { display: flex; }
  .folha { width: 100%; background: var(--surface); border-radius: 22px 22px 0 0; padding: 22px 20px 20px; }
  .folha h3 { margin: 0 0 4px; font-size: 18px; }
  .folha .tipo { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
  .folha .linha { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); font-size: 14px; }
  .folha .linha span:first-child { color: var(--muted); }
  .folha .linha span:last-child { text-align: right; font-weight: 600; overflow-wrap: anywhere; }
  .folha .botoes { display: flex; gap: 10px; margin-top: 18px; }
  .folha .botoes button { flex: 1; height: 50px; border-radius: 14px; font: inherit; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  .folha .botoes .enviar { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* Carregando / vazio / erro */
  .aviso {
    position: absolute; inset: 0; background: var(--surface); z-index: 30;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: 24px; text-align: center; color: var(--muted);
  }
  .aviso[hidden] { display: none; }
  .aviso button { font: inherit; font-weight: 600; padding: 10px 18px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
</style>
</head>
<body>
<div class="app">
  <div class="status" id="status"></div>

  <div class="topo">
    <div class="titulo">
      <h1 id="nome">—</h1>
      <div class="sub"><span id="sku">—</span><span class="chip-cat" id="cat">—</span></div>
    </div>
    <button class="menu-btn" onclick="abrirMenu()" aria-label="Menu">☰<span class="ponto" id="pontoFiltro" hidden></span></button>
  </div>

  <div class="foto" id="fotoBox">
    <div class="ph" id="fotoPh"><b>📦</b><span>Sem foto</span></div>
    <img id="fotoImg" alt="" hidden>
  </div>

  <div>
    <div class="contador">
      <button class="passo" onclick="mudar('estoque', -1)" aria-label="Diminuir quantidade">−</button>
      <input class="numero" id="estoque" type="number" inputmode="numeric" min="0" step="1" onchange="digitar('estoque')">
      <button class="passo mais" onclick="mudar('estoque', 1)" aria-label="Aumentar quantidade">+</button>
    </div>
    <div class="rotulo-cont">quantidade contada</div>
  </div>

  <label class="validade" id="valBox">
    <span>Validade</span> <small id="valTxt">—</small>
    <input type="date" id="validade" onchange="mudarValidade()">
  </label>

  <div class="nav">
    <button class="seta" onclick="ir(-1)" aria-label="Produto anterior">⇦</button>
    <div class="pos"><span id="pos">—</span><small id="posCat">—</small></div>
    <button class="seta" onclick="ir(1)" aria-label="Próximo produto">⇨</button>
  </div>

  <div class="sem-etiqueta">
    <span>Sem Etiqueta</span>
    <button class="passo" onclick="mudar('semEtiqueta', -1)" aria-label="Diminuir sem etiqueta">−</button>
    <input class="numero" id="semEtiqueta" type="number" inputmode="numeric" min="0" step="1" onchange="digitar('semEtiqueta')">
    <button class="passo mais" onclick="mudar('semEtiqueta', 1)" aria-label="Aumentar sem etiqueta">+</button>
  </div>

  <!-- Menu ☰ -->
  <div class="veu" id="veu" onclick="fecharMenu()"></div>
  <aside class="gaveta" id="gaveta">
    <h2>Menu <button onclick="fecharMenu()" aria-label="Fechar">×</button></h2>
    <div class="secao">Filtro — categoria</div>
    <div class="cats" id="cats"></div>
    <div class="secao" style="margin-top:6px">Relatório</div>
    <div class="rels">
      <button onclick="pedirRelatorio('produtos')"><span class="ic">📋</span><span><b>Produtos</b><small>quantidades e validades</small></span></button>
      <button onclick="pedirRelatorio('semEtiqueta')"><span class="ic">🏷️</span><span><b>Sem etiqueta</b><small>só o que falta etiquetar</small></span></button>
    </div>
    <div class="dica">Usa a categoria do filtro e envia para os e-mails cadastrados.</div>
    <div class="secao" style="margin-top:6px">Pesquisa</div>
    <input type="search" id="busca" placeholder="Nome ou código do produto…" oninput="listar()">
    <div class="dica" id="dicaBusca"></div>
    <div class="lista" id="lista"></div>
  </aside>

  <!-- Confirmação do relatório -->
  <div class="folha-veu" id="folhaVeu" onclick="if (event.target === this) fecharFolha()">
    <div class="folha">
      <h3>Enviar relatório por e-mail?</h3>
      <div class="tipo" id="fTipo"></div>
      <div class="linha"><span>Categoria</span><span id="fCat"></span></div>
      <div class="linha"><span>Produtos</span><span id="fQtd"></span></div>
      <div class="linha"><span>Para</span><span id="fPara"></span></div>
      <div class="botoes">
        <button onclick="fecharFolha()">Cancelar</button>
        <button class="enviar" id="btnEnviar" onclick="enviarRelatorio()">Enviar</button>
      </div>
    </div>
  </div>

  <!-- Carregando / sem produtos / erro -->
  <div class="aviso" id="aviso">Carregando produtos…</div>
</div>

<script>
  const $ = id => document.getElementById(id);
  let produtos = [];       // todos, na ordem das abas e das linhas
  let categorias = [];     // [{ nome, qtd }]
  let destinatarios = [];
  let filtro = '';         // '' = Todas
  let visiveis = [];       // produtos do filtro atual
  let i = 0;               // posição dentro de "visiveis"

  /* ---------------- Carregar ---------------- */
  function carregar() {
    mostrarAviso('Carregando produtos…');
    google.script.run
      .withSuccessHandler(r => {
        produtos = r.produtos;
        categorias = r.categorias;
        destinatarios = r.destinatarios || [];
        if (!produtos.length) {
          return mostrarAviso('Nenhum produto encontrado.<br>Cada aba com as colunas <b>SKU</b>, <b>Produto</b> e <b>Estoque</b> vira uma categoria.', true);
        }
        $('aviso').hidden = true;
        const salvo = lerPosicao();
        const nomes = categorias.map(c => c.nome);
        const cat = salvo && (salvo.filtro === '' || nomes.includes(salvo.filtro)) ? salvo.filtro : nomes[0];
        const alvo = salvo ? produtos.find(p => p.aba === salvo.aba && p.sku === salvo.sku) : null;
        aplicarFiltro(cat, alvo && (!cat || alvo.aba === cat) ? alvo : null);
      })
      .withFailureHandler(e => mostrarAviso('Erro ao carregar: ' + esc(e.message || e), true))
      .listarProdutos();
  }

  function mostrarAviso(html, comBotao) {
    const a = $('aviso');
    a.innerHTML = '<div>' + html + '</div>' + (comBotao ? '<button onclick="carregar()">⟳ Recarregar</button>' : '');
    a.hidden = false;
  }

  /* ---------------- Filtro por categoria ---------------- */
  function aplicarFiltro(cat, produtoAlvo) {
    enviarTodos();
    filtro = cat;
    visiveis = produtos.filter(p => !filtro || p.aba === filtro);
    i = produtoAlvo ? Math.max(0, visiveis.indexOf(produtoAlvo)) : 0;
    $('pontoFiltro').hidden = !filtro;
    mostrar();
  }

  /* ---------------- Mostrar produto ---------------- */
  function mostrar() {
    const p = visiveis[i];
    if (!p) return;
    $('nome').textContent = p.nome;
    $('sku').textContent = p.sku;
    $('cat').textContent = p.aba;
    $('estoque').value = p.estoque;
    $('semEtiqueta').value = p.semEtiqueta;
    $('validade').value = p.validade || '';
    mostrarValidade(p.validade);
    mostrarFoto(p.foto);
    $('pos').textContent = (i + 1) + ' de ' + visiveis.length;
    $('posCat').textContent = filtro || 'Todas as categorias';
    guardarPosicao();
    const prox = visiveis[(i + 1) % visiveis.length];
    if (prox && prox.foto) new Image().src = prox.foto; // pré-carrega a próxima foto
  }

  function mostrarValidade(iso) {
    if (iso) {
      const [a, m, d] = iso.split('-');
      $('valTxt').textContent = d + '/' + m + '/' + a;
      const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
      $('valBox').classList.toggle('vencido', new Date(+a, m - 1, +d) < hoje);
    } else {
      $('valTxt').textContent = 'tocar para definir';
      $('valBox').classList.remove('vencido');
    }
  }

  function mostrarFoto(url) {
    const img = $('fotoImg');
    img.hidden = true;
    $('fotoPh').hidden = false;
    img.onload = () => { img.hidden = false; $('fotoPh').hidden = true; };
    img.onerror = () => { img.hidden = true; $('fotoPh').hidden = false; };
    if (url) img.src = url; else img.removeAttribute('src');
  }

  /* ---------------- Alterar valores ---------------- */
  function mudar(campo, delta) {
    const p = visiveis[i];
    if (!p) return;
    const novo = Math.max(0, (p[campo] || 0) + delta);
    if (novo === p[campo]) return;
    p[campo] = novo;
    $(campo).value = novo;
    if (navigator.vibrate) navigator.vibrate(15);
    agendar(p, campo);
  }

  function digitar(campo) {
    const p = visiveis[i];
    if (!p) return;
    const v = Math.max(0, parseInt($(campo).value, 10) || 0);
    $(campo).value = v;
    if (v === p[campo]) return;
    p[campo] = v;
    agendar(p, campo, 0);
  }

  function mudarValidade() {
    const p = visiveis[i];
    if (!p) return;
    const nova = $('validade').value || '';
    if (nova === (p.validade || '')) return; // mesma data: nada a gravar
    p.validade = nova;
    mostrarValidade(p.validade);
    agendar(p, 'validade', 0);
  }

  /* ---------------- Salvar na planilha ----------------
     Toques seguidos no mesmo campo são juntados e a planilha recebe sempre o
     valor final — não há risco de contar duas vezes. */
  const pendentes = {};   // "aba|sku|campo" → { p, campo, timer, tentativas }
  let emAndamento = 0;
  let falhou = null;

  function agendar(p, campo, espera) {
    const chave = p.aba + '|' + p.sku + '|' + campo;
    const item = pendentes[chave] || (pendentes[chave] = { p, campo, tentativas: 0 });
    clearTimeout(item.timer);
    item.tentativas = 0;
    status('Salvando…', 'salvando');
    item.timer = setTimeout(() => enviar(chave), espera === undefined ? 400 : espera);
  }

  function enviar(chave) {
    const item = pendentes[chave];
    if (!item) return;
    delete pendentes[chave];
    clearTimeout(item.timer);
    const valor = item.p[item.campo];
    emAndamento++;
    google.script.run
      .withSuccessHandler(r => {
        emAndamento--;
        if (r && r.linha) item.p.linha = r.linha;
        atualizarStatus();
      })
      .withFailureHandler(e => {
        emAndamento--;
        item.tentativas++;
        if (item.tentativas < 3) {
          if (!pendentes[chave]) {
            pendentes[chave] = item;
            item.timer = setTimeout(() => enviar(chave), 1500 * item.tentativas);
          }
          status('Salvando… (nova tentativa)', 'salvando');
        } else {
          falhou = item;
          status('⚠ Não salvou ' + item.p.sku + '. Toque para tentar de novo', 'erro');
          console.error(e);
        }
      })
      .salvarCampo(item.p.aba, item.p.sku, item.p.linha, item.campo, valor);
  }

  function enviarTodos() { Object.keys(pendentes).forEach(enviar); }
  function temPendencia() { return emAndamento > 0 || Object.keys(pendentes).length > 0; }

  $('status').onclick = () => {
    if (!falhou) return;
    const item = falhou; falhou = null;
    agendar(item.p, item.campo, 0);
  };

  function atualizarStatus() {
    if (falhou) return;
    if (temPendencia()) status('Salvando…', 'salvando');
    else status('✓ Salvo na planilha', '', 1200);
  }

  function status(texto, tipo, some, html) {
    const s = $('status');
    if (html) s.innerHTML = html; else s.textContent = texto;
    s.className = 'status show' + (tipo ? ' ' + tipo : '');
    clearTimeout(s._t);
    if (some) s._t = setTimeout(() => s.classList.remove('show'), some);
  }

  window.addEventListener('beforeunload', ev => {
    if (temPendencia()) {
      enviarTodos();
      ev.preventDefault();
      ev.returnValue = '';
    }
  });

  /* ---------------- Navegação ---------------- */
  function ir(d) {
    if (!visiveis.length) return;
    enviarTodos(); // grava na hora o que ainda estava esperando
    i = (i + d + visiveis.length) % visiveis.length; // dá a volta
    mostrar();
  }

  let x0 = null;
  $('fotoBox').addEventListener('touchstart', e => x0 = e.touches[0].clientX, { passive: true });
  $('fotoBox').addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 50) ir(dx < 0 ? 1 : -1);
    x0 = null;
  });

  // Lembra o filtro e o produto onde parou (só neste aparelho)
  function guardarPosicao() {
    const p = visiveis[i];
    try { localStorage.setItem('contagem.v2', JSON.stringify({ filtro, aba: p.aba, sku: p.sku })); } catch (e) {}
  }
  function lerPosicao() {
    try { return JSON.parse(localStorage.getItem('contagem.v2') || 'null'); } catch (e) { return null; }
  }

  /* ---------------- Menu ---------------- */
  function abrirMenu() {
    $('veu').classList.add('aberto');
    $('gaveta').classList.add('aberta');
    $('busca').value = '';
    desenharCats();
    listar();
  }
  function fecharMenu() {
    $('veu').classList.remove('aberto');
    $('gaveta').classList.remove('aberta');
  }

  function desenharCats() {
    const opcoes = [{ nome: '', rotulo: 'Todas', qtd: produtos.length }]
      .concat(categorias.map(c => ({ nome: c.nome, rotulo: c.nome, qtd: c.qtd })));
    $('cats').innerHTML = opcoes.map((o, k) =>
      `<button class="${o.nome === filtro ? 'ativa' : ''}" data-k="${k}"><span>${esc(o.rotulo)}</span><small>${o.qtd} produtos</small></button>`
    ).join('');
    $('cats').querySelectorAll('button').forEach(b => b.onclick = () => {
      const nova = opcoes[+b.dataset.k].nome;
      const atual = visiveis[i];
      // continua no mesmo produto se ele fizer parte da categoria escolhida
      aplicarFiltro(nova, atual && (!nova || atual.aba === nova) ? atual : null);
      fecharMenu();
    });
  }

  function semAcento(s) { return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function listar() {
    const q = semAcento($('busca').value.trim());
    if (!q) {
      $('dicaBusca').textContent = 'Procura em todas as categorias. Ao escolher um produto, o filtro muda para a categoria dele.';
      $('lista').innerHTML = '';
      return;
    }
    const achados = produtos.filter(p => semAcento(p.nome + ' ' + p.sku).includes(q));
    $('dicaBusca').textContent = achados.length + (achados.length === 1 ? ' produto encontrado' : ' produtos encontrados');
    $('lista').innerHTML = achados.slice(0, 100).map(p =>
      `<button class="${p === visiveis[i] ? 'atual' : ''}" data-k="${produtos.indexOf(p)}">${esc(p.nome)}
         <div class="meta"><span>${esc(p.sku)}</span><span class="chip-cat">${esc(p.aba)}</span></div></button>`
    ).join('') || '<div class="dica" style="padding:12px 18px">Nenhum produto encontrado.</div>';
    $('lista').querySelectorAll('button').forEach(b => b.onclick = () => {
      const p = produtos[+b.dataset.k];
      aplicarFiltro(filtro && filtro !== p.aba ? p.aba : filtro, p); // troca de categoria se precisar
      fecharMenu();
    });
  }

  /* ---------------- Relatório ---------------- */
  const TIPOS = { produtos: 'Produtos, quantidades e validades', semEtiqueta: 'Produtos sem etiqueta' };
  let relPedido = null;

  function pedirRelatorio(tipo) {
    relPedido = tipo;
    const doFiltro = produtos.filter(p => !filtro || p.aba === filtro);
    const n = tipo === 'semEtiqueta' ? doFiltro.filter(p => p.semEtiqueta > 0).length : doFiltro.length;
    $('fTipo').textContent = TIPOS[tipo];
    $('fCat').textContent = filtro || 'Todas as categorias';
    $('fQtd').textContent = tipo === 'semEtiqueta' ? n + ' com unidades sem etiqueta' : n;
    $('fPara').innerHTML = destinatarios.map(esc).join('<br>') || '—';
    fecharMenu();
    $('folhaVeu').classList.add('aberta');
  }
  function fecharFolha() { $('folhaVeu').classList.remove('aberta'); }

  async function enviarRelatorio() {
    fecharFolha();
    status('Enviando relatório…', 'salvando');
    // Garante que a última contagem já está na planilha antes de gerar o relatório
    enviarTodos();
    for (let t = 0; t < 60 && temPendencia(); t++) await new Promise(r => setTimeout(r, 250));
    google.script.run
      .withSuccessHandler(r => {
        status('', 'link', 8000, '✓ Relatório enviado <a href="' + esc(r.url) + '" target="_blank" rel="noopener">abrir PDF</a>');
      })
      .withFailureHandler(e => {
        status('⚠ Não foi possível enviar: ' + (e.message || e), 'erro', 8000);
      })
      .enviarRelatorio(relPedido, filtro);
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  carregar();
</script>
</body>
</html>
